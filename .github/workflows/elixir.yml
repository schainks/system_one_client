name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"   # floor from mix.exs (~> 1.18)
            otp: "27"
          - elixir: "1.20"   # what scripts/run.sh uses locally
            otp: "28"
          - elixir: "1.20"   # latest
            otp: "29"
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-test-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-test-${{ matrix.otp }}-${{ matrix.elixir }}-
      - run: mix deps.get --check-locked
      - run: mix test

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-lint-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-lint-
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: mix deps.unlock --check-unused
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - name: Restore Dialyzer PLT cache
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-1.20-29-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-1.20-29-
      - run: mix dialyzer --format github

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: docs
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - run: mix deps.get --check-locked
      - run: mix docs --warnings-as-errors
      - run: mix hex.build
