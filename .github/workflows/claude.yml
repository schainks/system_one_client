name: Claude

# A maintainer writes "@claude ..." on an issue or pull request and Claude does the work:
# reproduce and fix a bug, implement a provider from an issue, or review a pull request.
#
# Only people with write access can trigger it (the action's default). Pull requests
# from forks are skipped (the action's default), because this job has write access and
# would otherwise run a stranger's code with it.
#
# Needs the ANTHROPIC_API_KEY secret and the Claude GitHub App installed on the repo.
# The App is what lets pull requests opened by Claude start CI.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  claude:
    name: Claude
    if: >-
      github.repository == 'schainks/system_one_client' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - run: mix deps.get
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(mix:*)"
            --append-system-prompt "Read CONTRIBUTING.md before changing code and follow it: tagged error tuples, no real network calls in tests, a changelog entry, and the Why / What / Testing pull request sections. For a new provider follow its 'Adding a provider' checklist. Run mix format, mix compile --warnings-as-errors, mix credo --strict and mix test before you finish. You have no provider API keys, so say plainly in the pull request that the change is untested against the real service. Never change mix.exs version, tags or anything under .github/ unless the maintainer asked for exactly that."
